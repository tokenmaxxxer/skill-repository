skill: conformance-review-sampling-derivation
rule_targets:
  - "rule 5: assign each stratum an impact tier from the stated consequence of failure and exempt the highest tier from sampling entirely — inspect every item in it"
  - "rule 1: stratify by risk before sampling so a small critical stratum is not diluted by a large low-risk one"
  - "rule 3: state the sampling derivation explicitly in the record"
ungated_expected_failure: >-
  An agent without the skill adopts the flat 10% proportional draw — it sounds fair, simple, and defensible against cherry-picking accusations — leaving ~16 of the 18 security-critical entries unexamined, treating a secrets-storage entry and a dashboard-cosmetics entry as equally safe to skip.
gated_expected_behavior: >-
  Rules 1, 3, 5: stratify by the requirement's stated consequence of failure; the security-critical stratum (18 entries) is inspected in full, sampling is reserved for the routing and cosmetic strata, and the record states population, strata, per-stratum sample sizes, and selection method.
incidents:
  - "on-the-record#1610 (the 40-entry patrol precision sample — a declared sample — is what surfaced 6 confirmed unsupported-claim violations)"
